# Push to main -> backend tests -> deploy to the production server (deploy/deploy.sh ci) -> site health check.
# Secrets: DEPLOY_HOST (server IP), DEPLOY_SSH_KEY (private deploy key), DEPLOY_KNOWN_HOSTS (server host key line).
# The server's .env, model weights and cache stay on the server; CI only sends the code. See deploy/README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued (not yet started) one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://217-177-40-47.sslip.io
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: deploy/deploy.sh ci
