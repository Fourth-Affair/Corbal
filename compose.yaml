services:
  frontend:
    build:
      context: ./frontend
      target: dev
    # Refresh the persistent node_modules volume after dependency changes.
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SUPABASE_BUCKET: ${NEXT_PUBLIC_SUPABASE_BUCKET:-plans}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATASET_DIR: /dataset/junction-dataset
      CUBICASA_ORIG_DIR: /dataset/cubicasa5k-original/cubicasa5k
      CACHE_DIR: /dataset/cache
      MODELS_DIR: /models
      PLAN_SOURCE: ${PLAN_SOURCE:-model}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-1}
      ANALYSIS_QUEUE_TIMEOUT: ${ANALYSIS_QUEUE_TIMEOUT:-45}
      # Model warm-up at startup (app/warmup.py) costs ~10-20 s of CPU on every hot reload: off in dev
      WARMUP: ${WARMUP:-0}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
      - ./models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  frontend_node_modules:
