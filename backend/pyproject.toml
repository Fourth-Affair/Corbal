[project]
name = "junc-backend"
version = "0.1.0"
description = "Answers questions about construction drawings with verifiable citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic>=2.9",
    "pillow>=11",
    "numpy>=2",
    "shapely>=2",
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "rapidocr-onnxruntime>=1.4",
    "scipy>=1.18.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
]

# CPU-only torch wheels (no CUDA download). Switch the index to a cu12x one on a GPU box.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
